global:
  resolve_timeout: 5m

route:
  receiver: discord-operations
  group_by: [severity, generation, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord-operations
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: "{{ .Status | toUpper }}: BrawlTome {{ .CommonLabels.severity }} alerts"
        message: >-
          {{ range .Alerts }}{{ .Labels.alertname }}: {{ .Annotations.summary }}
          Severity: {{ .Labels.severity }} | Signal: {{ .Labels.signal }} | Generation: {{ .Labels.generation }}{{ with .Labels.failure_category }} | Category: {{ . }}{{ end }}{{ "\n" }}{{ end }}

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, signal]
