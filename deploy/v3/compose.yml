services:
  postgres:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: postgres
    user: "70:70"
    environment:
      POSTGRES_DB: brawltome
      POSTGRES_USER: brawltome_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_owner_password
      - postgres_runtime_password
    volumes:
      - type: bind
        source: ${V3_POSTGRES_DATA_ROOT:?Set the dedicated V3 PostgreSQL data root}
        target: /var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0750,size=16m
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0750,size=32m
    networks:
      - application
    healthcheck:
      test: [CMD-SHELL, pg_isready -U brawltome_owner -d brawltome]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
        reservations:
          memory: 512M

  migration:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
    secrets:
      - migration_database_url
    networks:
      - application
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=32m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    environment:
      AUTHENTICATED_REFRESH_IP_LIMIT: "120"
      CORS_ORIGIN: https://v3.brawltome.app
      MATCHMAKING_ENABLED: "true"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "3000"
      RUNTIME_CLEANUP_RESERVE_MS: "5000"
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
      WEB_ORIGIN: https://v3.brawltome.app
    secrets:
      - discord_internal_api_secret
      - runtime_database_url
      - internal_api_secret
      - metrics_scrape_secret
      - otel_authorization
      - refresh_trust_cookie_secret
      - r2_access_key_id
      - r2_secret_access_key
      - r2_endpoint
      - r2_bucket
    networks:
      - application
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3000/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
          pids: 256
        reservations:
          memory: 256M

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${V3_PUBLIC_API_URL:?Set the future browser-reachable V3 API URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
    environment:
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:3000
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "3000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - internal_api_secret
      - metrics_scrape_secret
      - otel_authorization
    networks:
      - application
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/health/ready').then(r => { if (!r.ok) process.exit(1) })
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 192
        reservations:
          memory: 192M

  operations-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: operations-worker
    environment:
      AUTHENTICATED_REFRESH_IP_LIMIT: "120"
      BRAWLHALLA_V1_REQUEST_LIMIT: "1"
      HEALTH_PORT: "3001"
      NODE_ENV: production
      OPERATIONS_EXECUTION_SLOTS: "2"
      OPERATIONS_INTERACTIVE_CONCURRENCY: "2"
      OPERATIONS_INTERACTIVE_RESERVATION: "1"
      OPERATIONS_REPLAY_SIMULATION_CONCURRENCY: "1"
      OPERATIONS_TOTAL_CONCURRENCY: "3"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUNTIME_CLEANUP_RESERVE_MS: "5000"
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - brawlhalla_api_key
      - metrics_scrape_secret
      - runtime_database_url
      - otel_authorization
    networks:
      - application
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3001/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
          pids: 256
        reservations:
          memory: 256M

  replay-simulator-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: replay-simulator-worker
    environment:
      BRAWLTOME_REPOSITORY_REVISION: ${V3_REPOSITORY_REVISION:?Set deployed git revision}
      HEALTH_PORT: "3003"
      NODE_ENV: production
      OPERATIONS_EXECUTION_SLOTS: "1"
      OPERATIONS_INTERACTIVE_CONCURRENCY: "2"
      OPERATIONS_INTERACTIVE_RESERVATION: "1"
      OPERATIONS_REPLAY_SIMULATION_CONCURRENCY: "1"
      OPERATIONS_TOTAL_CONCURRENCY: "3"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      REPLAY_SIMULATION_TIMEOUT_MS: "300000"
      REPLAY_SIMULATOR_RUNTIME_URL: http://replay-simulator-runtime:3004
      RUNTIME_CLEANUP_RESERVE_MS: "5000"
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - metrics_scrape_secret
      - runtime_database_url
      - otel_authorization
      - r2_access_key_id
      - r2_secret_access_key
      - r2_endpoint
      - r2_bucket
    networks:
      - application
    depends_on:
      migration:
        condition: service_completed_successfully
      replay-simulator-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3003/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
        reservations:
          memory: 256M

  replay-simulator-runtime:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: replay-simulator-runtime
      args:
        REPLAY_SIMULATOR_RUNTIME_BASE: brawlhalla-replay-spike:steam-replay
    user: "10001:10001"
    environment:
      GAME_DIR: /game
      HEALTH_PORT: "3004"
      HOME: /home/runner
      NODE_ENV: production
      PLAYBACK_MODE: seek-end
      PROTON_DIR: /proton
      REPLAY_SIMULATION_TIMEOUT_MS: "300000"
      REPLAY_SIMULATOR_TERM_GRACE_MS: "10000"
      RUNTIME_CLEANUP_RESERVE_MS: "5000"
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      STEAM_ROOT: /home/runner/.steam/debian-installation
    volumes:
      - type: volume
        source: brawlhalla-replay-spike-home
        target: /home/runner
      - type: volume
        source: brawlhalla-replay-spike-game
        target: /game
      - type: volume
        source: brawlhalla-replay-spike-proton
        target: /proton
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/bun
        - -e
        - const r = await fetch('http://localhost:3004/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - apparmor:brawlhalla-steam
      - seccomp:unconfined
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0750,size=512m
      - /dev/shm:rw,nosuid,nodev,uid=10001,gid=10001,mode=1777,size=512m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
          pids: 1024
        reservations:
          memory: 1G

  discord-bot:
    profiles: [discord]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: discord-bot
    environment:
      API_URL: http://api:3000
      DISCORD_CLIENT_ID: ${V3_DISCORD_CLIENT_ID:-deferred}
      DISCORD_METRICS_PORT: "3002"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - discord_internal_api_secret
      - discord_token
      - internal_api_secret
      - metrics_scrape_secret
      - otel_authorization
    networks:
      - application
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3002/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 192
        reservations:
          memory: 192M

networks:
  application:
    external: true
    name: brawltome-v3

volumes:
  brawlhalla-replay-spike-home:
    external: true
  brawlhalla-replay-spike-game:
    external: true
  brawlhalla-replay-spike-proton:
    external: true

secrets:
  brawlhalla_api_key:
    name: brawltome-v3_brawlhalla_api_key
    file: /var/lib/brawltome-v3-secrets/brawlhalla-api-key
  discord_internal_api_secret:
    name: brawltome-v3_discord_internal_api_secret
    file: /var/lib/brawltome-v3-secrets/discord-internal-api-secret
  discord_token:
    name: brawltome-v3_discord_token
    file: /var/lib/brawltome-v3-secrets/discord-token
  internal_api_secret:
    name: brawltome-v3_internal_api_secret
    file: /var/lib/brawltome-v3-secrets/internal-api-secret
  metrics_scrape_secret:
    name: brawltome-v3_metrics_scrape_secret
    file: /var/lib/brawltome-v3-secrets/metrics-scrape-secret
  migration_database_url:
    name: brawltome-v3_migration_database_url
    file: /var/lib/brawltome-v3-secrets/migration-database-url
  otel_authorization:
    name: brawltome-v3_otel_authorization
    file: /var/lib/brawltome-v3-secrets/otel-authorization
  postgres_owner_password:
    name: brawltome-v3_postgres_owner_password
    file: /var/lib/brawltome-v3-secrets/postgres-owner-password
  postgres_runtime_password:
    name: brawltome-v3_postgres_runtime_password
    file: /var/lib/brawltome-v3-secrets/postgres-runtime-password
  r2_access_key_id:
    name: brawltome-v3_r2_access_key_id
    file: /var/lib/brawltome-v3-secrets/r2-access-key-id
  r2_secret_access_key:
    name: brawltome-v3_r2_secret_access_key
    file: /var/lib/brawltome-v3-secrets/r2-secret-access-key
  r2_endpoint:
    name: brawltome-v3_r2_endpoint
    file: /var/lib/brawltome-v3-secrets/r2-endpoint
  r2_bucket:
    name: brawltome-v3_r2_bucket
    file: /var/lib/brawltome-v3-secrets/r2-bucket
  refresh_trust_cookie_secret:
    name: brawltome-v3_refresh_trust_cookie_secret
    file: /var/lib/brawltome-v3-secrets/refresh-trust-cookie-secret
  runtime_database_url:
    name: brawltome-v3_runtime_database_url
    file: /var/lib/brawltome-v3-secrets/runtime-database-url
