services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: brawltome
      POSTGRES_PASSWORD: brawltome
      POSTGRES_DB: brawltome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brawltome -d brawltome"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
