name: Feature Request
description: Suggest a new feature or enhancement
labels: ['enhancement']
body:
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which part of BrawlTome would this affect?
      options:
        - Web (Frontend)
        - API (Backend)
        - Worker (Background Jobs)
        - Discord Bot
        - Database / Schema
        - New Library
        - Multiple / Cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this solve or what use case does it enable?
      placeholder: As a user, I want to... so that I can...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: Describe your ideal solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?
      placeholder: Alternative solutions or workarounds

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, related issues, etc.
      placeholder: Any extra info that helps explain the request

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and feature requests
          required: true
        - label: This aligns with BrawlTome's purpose (Brawlhalla stats tracking)
          required: false
