name: CI
on: [push, pull_request]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run architecture:check
      - run: docker compose config --quiet

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tooling/observability/tests/deploy-wrapper.test.ts tooling/observability/tests/observability.test.ts tooling/observability/tests/network-preflight.test.ts tooling/observability/tests/rendered-topology.test.ts tooling/observability/tests/storage-preflight.test.ts packages/telemetry/tests/otlp.test.ts
      - run: bun run observability:validate
      - run: bun run observability:test-alerts
      - run: bun run observability:test-pipeline

  v3-deployment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine@sha256:3b057e1c2c6dfee60a30950096f3fab33be141dbb0fdd7af3d477083de94166c
        env:
          POSTGRES_USER: brawltome
          POSTGRES_PASSWORD: brawltome
          POSTGRES_DB: brawltome
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://brawltome:brawltome@localhost:5432/brawltome
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tooling/deployment/tests apps/web/tests/lib/api-url.test.ts apps/web/tests/lib/web-readiness.test.ts apps/api/tests/runtime-lifecycle.test.ts
      - run: bun test apps/api/tests/runtime-process.test.ts
      - run: bun test apps/api/tests/refresh-operations.postgres.test.ts
      - run: V3_DISCORD_CLIENT_ID=123456789012345678 V3_POSTGRES_DATA_ROOT=/srv/brawltome-v3/postgres V3_TURNSTILE_SITE_KEY=test-site-key docker compose --profile discord --profile operator -f deploy/v3/compose.yml config --quiet
      - run: V3_DISCORD_CLIENT_ID=123456789012345678 V3_POSTGRES_DATA_ROOT=/srv/brawltome-v3/postgres V3_TURNSTILE_SITE_KEY=test-site-key docker compose --profile discord --profile operator -f deploy/v3/compose.yml build

  launch-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brawltome_v3
          POSTGRES_PASSWORD: brawltome_v3
          POSTGRES_DB: brawltome_v3
        ports:
          - 55436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://brawltome_v3:brawltome_v3@127.0.0.1:55436/brawltome_v3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run parity:check

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: bun install --frozen-lockfile
      - run: bun run contracts:check

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brawltome_v3
          POSTGRES_PASSWORD: brawltome_v3
          POSTGRES_DB: brawltome_v3
        ports:
          - 55436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://brawltome_v3:brawltome_v3@127.0.0.1:55436/brawltome_v3
      ALLOW_DESTRUCTIVE_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test
