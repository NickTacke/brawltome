name: CI
on:
  push:
    branches: [master]
  pull_request: {}
permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --network-concurrency 16 || bun install --frozen-lockfile --network-concurrency 16
      - run: bun run architecture:check
      - run: docker compose config --quiet

  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine@sha256:3b057e1c2c6dfee60a30950096f3fab33be141dbb0fdd7af3d477083de94166c
        env:
          POSTGRES_USER: brawltome
          POSTGRES_PASSWORD: brawltome
          POSTGRES_DB: brawltome
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://brawltome:brawltome@localhost:5432/brawltome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --network-concurrency 16 || bun install --frozen-lockfile --network-concurrency 16
      - run: bun run infra:app:check
      - run: BRAWLTOME_IMAGE_TAG=0000000000000000000000000000000000000000 DISCORD_CLIENT_ID=123456789012345678 POSTGRES_DATA_ROOT=/srv/brawltome/postgres docker compose --profile discord --profile operator -f infra/app/compose.yml config --quiet
      # production images are built and pushed on master; pull requests still prove that every target builds
      - name: Build every image target
        run: |
          for target in postgres migration dead-letter-role dead-letter-cli api web operations-worker discord-bot; do
            docker build --target "$target" \
              --build-arg NEXT_PUBLIC_API_URL=https://api.brawltome.app \
              --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=test-site-key \
              .
          done

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - run: bun install --frozen-lockfile --network-concurrency 16 || bun install --frozen-lockfile --network-concurrency 16
      - run: bun run contracts:check

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brawltome_test
          POSTGRES_PASSWORD: brawltome_test
          POSTGRES_DB: brawltome_test
        ports:
          - 55436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://brawltome_test:brawltome_test@127.0.0.1:55436/brawltome_test
      ALLOW_DESTRUCTIVE_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --network-concurrency 16 || bun install --frozen-lockfile --network-concurrency 16
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test

  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [migration, dead-letter-role, dead-letter-cli, api, web, operations-worker, discord-bot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the web image bakes this key into the browser bundle, and the Dockerfile only checks the API URL
      - name: Require the public Turnstile site key
        if: matrix.target == 'web'
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "repository variable TURNSTILE_SITE_KEY is empty, the web image would ship without it" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/nicktacke/brawltome-${{ matrix.target }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/NickTacke/brawltome
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.brawltome.app
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_ANALYTICS_ENABLED=${{ vars.ANALYTICS_ENABLED }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Dokploy always deploys the current head of master, and deploy.sh derives the image tag from that checkout, so an
  # older run can never deploy an older commit. A head whose images are not pushed yet fails at the pull step, and
  # that commit's own run deploys it once its images exist.
  deploy:
    needs: [images, architecture, infrastructure, contracts, check]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun infra/app/trigger-deploy.ts
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
