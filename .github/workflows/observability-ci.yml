name: Observability CI

on:
  push:
    branches: [master]
    paths:
      - "infra/observability/**"
      - "packages/telemetry/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/observability-ci.yml"
  pull_request:
    paths:
      - "infra/observability/**"
      - "packages/telemetry/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/observability-ci.yml"

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run infra:observability:check
