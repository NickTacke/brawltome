name: Desktop CI

on:
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/desktop-ci.yml"
      - ".gitmodules"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/desktop-ci.yml"
      - ".gitmodules"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Set up SSH agent for private detection submodule
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DETECTION_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize private detection submodule over SSH
        shell: bash
        run: |
          git submodule sync --recursive
          git config submodule.apps/desktop/detection.url git@github.com:NickTacke/brawltome-detection.git
          git submodule update --init --recursive
          git submodule status --recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/desktop

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check repository-owned Rust formatting
        working-directory: apps/desktop
        shell: pwsh
        run: |
          rustfmt --check --edition 2021 `
            app/src/detection_bridge.rs `
            app/src/lib.rs `
            app/src/overlay.rs `
            app/src/tray.rs `
            app/src/updater_artifact.rs `
            app/src/windows_acceptance.rs `
            app/src/bin/verify_updater_artifact.rs `
            app/tests/updater_artifact.rs `
            app/tests/windows_acceptance.rs `
            app/tests/windows_lifecycle.rs

      - name: Lint Windows Rust targets
        working-directory: apps/desktop
        run: cargo clippy --locked -p brawltome-desktop -p brawltome-events --all-targets --no-deps -- -D warnings

      - name: Test Windows Rust workspace
        working-directory: apps/desktop
        run: cargo test --locked --workspace

      - name: Test desktop TypeScript harnesses
        run: bun run --filter @brawltome/desktop test

      - name: Type-check desktop TypeScript
        run: bun run --filter @brawltome/desktop typecheck

      - name: Build full Tauri application without release bundles
        run: bun run --filter @brawltome/desktop build:ci
