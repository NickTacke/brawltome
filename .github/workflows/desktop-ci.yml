name: Desktop CI

on:
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/desktop-ci.yml"
      - ".gitmodules"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/desktop-ci.yml"
      - ".gitmodules"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Set up SSH agent for private detection submodule
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DETECTION_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize private detection submodule over SSH
        shell: bash
        run: |
          git submodule sync --recursive
          git config submodule.apps/desktop/detection.url git@github.com:NickTacke/brawltome-detection.git
          git submodule update --init --recursive
          git submodule status --recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/desktop

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check repository-owned Rust formatting
        working-directory: apps/desktop
        run: cargo fmt --package brawltome-desktop --package brawltome-events -- --check

      - name: Lint Windows Rust targets
        working-directory: apps/desktop
        run: cargo clippy --locked -p brawltome-desktop -p brawltome-events --all-targets --no-deps -- -D warnings

      - name: Test Windows Rust workspace
        working-directory: apps/desktop
        run: cargo test --locked --workspace

      - name: Build full Tauri application without release bundles
        run: bun run --filter @brawltome/desktop build:ci
