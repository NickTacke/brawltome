name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Set up SSH agent for private detection submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DETECTION_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Validate manual tag input resolves to an existing tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject anything that isn't shaped like one of our release tags
          # (vMAJOR.MINOR.PATCH, optional pre-release/build suffix). Stops a
          # typo or branch name from being passed straight to checkout +
          # softprops/action-gh-release, which would otherwise create a
          # release from an unintended ref.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+].+)?$ ]]; then
            echo "Invalid tag format: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          # Confirm the tag exists on the remote (no checkout yet at this
          # point, so go through the GitHub API). Stops workflow_dispatch
          # from creating a release for a tag that was never pushed.
          if ! gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "Tag does not exist on $REPO: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Initialize submodules with SSH agent
        shell: bash
        run: git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build Tauri release bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Calls the existing `build` script in apps/desktop/package.json which
        # invokes `tauri build`. `bun run --filter <pkg> tauri build` doesn't
        # work because there's no script literally named "tauri".
        run: bun run --filter @brawltome/desktop build

      - name: Locate built artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart('v')
          # Cargo workspaces output to the WORKSPACE target dir (apps/desktop/target),
          # not per-package (apps/desktop/app/target). tauri-cli detects the workspace
          # and follows that convention.
          $bundleDir = "apps/desktop/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer .exe found in $bundleDir"; exit 1 }
          if (-not $sig) { Write-Error "No installer .sig found in $bundleDir"; exit 1 }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "sig_path=$($sig.FullName)" >> $env:GITHUB_OUTPUT

      - name: Rename installer to stable filename
        shell: pwsh
        run: |
          Copy-Item "${{ steps.artifacts.outputs.exe_path }}" "apps/desktop/BrawlTome-Setup.exe"
          Copy-Item "${{ steps.artifacts.outputs.sig_path }}" "apps/desktop/BrawlTome-Setup.exe.sig"

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.artifacts.outputs.version }}"
          $sig = (Get-Content "apps/desktop/BrawlTome-Setup.exe.sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/BrawlTome-Setup.exe"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $latest = @{
              version = $version
              notes = "BrawlTome ${{ github.event.inputs.tag || github.ref_name }}"
              pub_date = $pubDate
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $sig
                      url = $url
                  }
              }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path "apps/desktop/latest.json" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            apps/desktop/BrawlTome-Setup.exe
            apps/desktop/BrawlTome-Setup.exe.sig
            apps/desktop/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
