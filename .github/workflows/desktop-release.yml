name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag resolves to an existing safe SemVer tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid tag format (expected a safe SemVer release tag)"
            exit 1
          fi
          if ! gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            echo "Release tag does not exist"
            exit 1
          fi

      - name: Set up SSH agent for private detection submodule
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DETECTION_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Initialize private detection submodule over SSH
        shell: bash
        run: |
          git submodule sync --recursive
          git config submodule.apps/desktop/detection.url git@github.com:NickTacke/brawltome-detection.git
          git submodule update --init --recursive
          git submodule status --recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Run release Rust and TypeScript gates
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/Cargo.toml --package brawltome-desktop --package brawltome-events -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path apps/desktop/Cargo.toml -p brawltome-desktop -p brawltome-events --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --filter @brawltome/desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --filter @brawltome/desktop typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for updater artifacts"
          }

      - name: Build signed Tauri release bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --filter @brawltome/desktop build

      - name: Locate one matching installer and signature
        id: artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $bundleDir = "apps/desktop/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundleDir -Filter "*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer in $bundleDir; found $($installers.Count)"
          }
          $exe = $installers[0]
          $sig = Get-Item -LiteralPath "$($exe.FullName).sig" -ErrorAction Stop
          "version=$version" >> $env:GITHUB_OUTPUT
          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sig_path=$($sig.FullName)" >> $env:GITHUB_OUTPUT

      - name: Rename installer to stable filename
        shell: pwsh
        env:
          EXE_PATH: ${{ steps.artifacts.outputs.exe_path }}
          SIG_PATH: ${{ steps.artifacts.outputs.sig_path }}
        run: |
          Copy-Item -LiteralPath $env:EXE_PATH "apps/desktop/BrawlTome-Setup.exe"
          Copy-Item -LiteralPath $env:SIG_PATH "apps/desktop/BrawlTome-Setup.exe.sig"

      - name: Generate latest.json
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ steps.artifacts.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_VERSION
          $sig = (Get-Content "apps/desktop/BrawlTome-Setup.exe.sig" -Raw).Trim()
          $url = "https://github.com/$($env:REPO)/releases/download/$($env:RELEASE_TAG)/BrawlTome-Setup.exe"
          $latest = @{
              version = $version
              notes = "BrawlTome $($env:RELEASE_TAG)"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $sig
                      url = $url
                  }
              }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path "apps/desktop/latest.json" -Encoding utf8NoBOM

      - name: Cryptographically verify updater artifact and metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $url = "https://github.com/$($env:REPO)/releases/download/$($env:RELEASE_TAG)/BrawlTome-Setup.exe"
          cargo run --locked --manifest-path apps/desktop/Cargo.toml -p brawltome-desktop --bin verify_updater_artifact -- `
            apps/desktop/BrawlTome-Setup.exe `
            apps/desktop/BrawlTome-Setup.exe.sig `
            apps/desktop/latest.json `
            apps/desktop/app/tauri.conf.json `
            $url
          if ($LASTEXITCODE -ne 0) { throw "Updater artifact verification failed" }

      - name: Smoke NSIS install mechanics without claiming Windows 11 updater acceptance
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          $installer = (Resolve-Path "apps/desktop/BrawlTome-Setup.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)" }
          $entry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "BrawlTome" } |
            Select-Object -First 1
          if (-not $entry) { throw "BrawlTome uninstall registration was not created" }
          if ($entry.DisplayVersion -ne $env:RELEASE_VERSION) {
            throw "Installed version $($entry.DisplayVersion) does not match release"
          }

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release
          path: |
            apps/desktop/BrawlTome-Setup.exe
            apps/desktop/BrawlTome-Setup.exe.sig
            apps/desktop/latest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-release
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release/BrawlTome-Setup.exe \
            release/BrawlTome-Setup.exe.sig \
            release/latest.json \
            --verify-tag \
            --generate-notes \
            --title "BrawlTome $RELEASE_TAG"
