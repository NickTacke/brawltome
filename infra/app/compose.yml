services:
  postgres:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: postgres
    user: "70:70"
    # Parallel queries allocate dynamic shared memory in /dev/shm; Docker's 64 MB default is too small for work_mem=16MB.
    shm_size: 256m
    environment:
      POSTGRES_DB: brawltome
      POSTGRES_USER: brawltome_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_owner_password
      - postgres_runtime_password
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_ROOT:?Set the dedicated PostgreSQL data root}
        target: /var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0750,size=16m
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0750,size=32m
    networks:
      - application
    healthcheck:
      test: [CMD-SHELL, pg_isready -U brawltome_owner -d brawltome]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
          pids: 256
        reservations:
          memory: 512M

  migration:
    image: ghcr.io/nicktacke/brawltome-migration:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    secrets:
      - migration_database_url
    networks:
      - application
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=32m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128

  dead-letter-role:
    profiles: [operator]
    image: ghcr.io/nicktacke/brawltome-dead-letter-role:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    user: "70:70"
    environment:
      PGDATABASE: brawltome
      PGHOST: postgres
      PGUSER: brawltome_owner
    secrets:
      - postgres_dead_letter_password
      - postgres_owner_password
    networks:
      - application
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0750,size=16m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64

  dead-letter-cli:
    profiles: [operator]
    image: ghcr.io/nicktacke/brawltome-dead-letter-cli:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    secrets:
      - dead_letter_database_url
      - dead_letter_operator_tokens
    networks:
      - application
    depends_on:
      dead-letter-role:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=32m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64

  api:
    image: ghcr.io/nicktacke/brawltome-api:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    environment:
      AUTHENTICATED_REFRESH_IP_LIMIT: "120"
      CORS_ORIGIN: https://brawltome.app
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set the Discord OAuth client ID}
      DISCORD_REDIRECT_URI: https://api.brawltome.app/auth/discord/callback
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # postgres.js keeps idle pool connections forever by default, and a rolling deploy runs two APIs at once. Close
      # idle connections after 60 s; the pool sizes and application names are in apps/api/src/database-pools.ts.
      PGIDLE_TIMEOUT: "60"
      PORT: "3000"
      RUNTIME_CLEANUP_RESERVE_MS: "5000"
      RUNTIME_SHUTDOWN_ANNOUNCE_MS: "5000"
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
      WEB_ORIGIN: https://brawltome.app
    secrets:
      - discord_client_secret
      - discord_internal_api_secret
      - runtime_database_url
      - internal_api_secret
      - metrics_scrape_secret
      - otel_authorization
      - refresh_trust_cookie_secret
      - replay_bridge_secret
      - turnstile_secret_key
    networks:
      - application
      - observability
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3000/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
      start_interval: 2s
    stop_grace_period: 70s
    # Zero-downtime deploys (infra/app/deploy.sh). Dokploy appends its domain labels to this list and names the router
    # and service after the domain; these names must match the api.brawltome.app domain in Dokploy.
    labels:
      - traefik.http.middlewares.brawltome-api-retry.retry.attempts=3
      - traefik.http.routers.compose-program-virtual-microchip-uqxbrw-11-websecure.middlewares=brawltome-api-retry
      - traefik.http.services.compose-program-virtual-microchip-uqxbrw-11-websecure.loadbalancer.healthcheck.path=/health/serving
      - traefik.http.services.compose-program-virtual-microchip-uqxbrw-11-websecure.loadbalancer.healthcheck.interval=2s
      - traefik.http.services.compose-program-virtual-microchip-uqxbrw-11-websecure.loadbalancer.healthcheck.timeout=1s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
          pids: 256
        reservations:
          memory: 256M

  web:
    image: ghcr.io/nicktacke/brawltome-web:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    environment:
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:3000
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "3000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - internal_api_secret
      - matches_preview_token
      - metrics_scrape_secret
      - otel_authorization
    networks:
      - application
      - observability
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/health/live').then(r => { if (!r.ok) process.exit(1) })
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
    # See the api labels; these names must match the brawltome.app domain in Dokploy.
    labels:
      - traefik.http.middlewares.brawltome-web-retry.retry.attempts=3
      - traefik.http.routers.compose-program-virtual-microchip-uqxbrw-10-websecure.middlewares=brawltome-web-retry
      - traefik.http.services.compose-program-virtual-microchip-uqxbrw-10-websecure.loadbalancer.healthcheck.path=/api/health/serving
      - traefik.http.services.compose-program-virtual-microchip-uqxbrw-10-websecure.loadbalancer.healthcheck.interval=2s
      - traefik.http.services.compose-program-virtual-microchip-uqxbrw-10-websecure.loadbalancer.healthcheck.timeout=1s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
      # next/image writes optimized images here. On the read-only root filesystem the directory couldn't be created,
      # so every request re-optimized and concurrent requests for the same image (the header logo) hung until the
      # browser gave up (up to 125 s, 2026-10-18).
      - /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=256m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 192
        reservations:
          memory: 192M

  site:
    image: ghcr.io/nicktacke/brawltome-site:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    environment:
      INTERNAL_API_URL: http://api:3000
      NODE_ENV: production
      PORT: "3000"
      # the public turnstile site key, the same one the web image is built with from the TURNSTILE_SITE_KEY variable
      TURNSTILE_SITE_KEY: 0x4AAAAAACx60GKE7imjvcOh
    secrets:
      - internal_api_secret
    # Traefik reaches containers on dokploy-network. Dokploy only adds it, with its labels, to services that have a
    # Dokploy domain, so site declares its own routing and it moves with the repo if the stack leaves Dokploy
    networks:
      - application
      - dokploy-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3000/health/live'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
    # everything else on brawltome.app falls through to Dokploy's Host rule for web, whose default priority is its
    # length. only the .svg weapon icons move, web serves its own .png ones there. $$ is a literal $ in compose, and
    # verify-rendered-topology.ts pins these labels exactly
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.brawltome-site.rule=Host(`brawltome.app`) && (PathPrefix(`/player/`) || PathPrefix(`/guild/`) || PathPrefix(`/clan/`) || Path(`/privacy`) || Path(`/terms`) || PathPrefix(`/assets/`) || PathPrefix(`/_serverFn/`) || Path(`/stats`) || Path(`/learn`) || Path(`/tournaments`) || Path(`/images/legends/random.svg`) || Path(`/images/legends/avatars/qinghua-and-baobao.png`) || PathPrefix(`/images/flags/`) || PathRegexp(`^/images/weapons/[^/]+\.svg$$`))
      - traefik.http.routers.brawltome-site.priority=1000
      - traefik.http.routers.brawltome-site.entrypoints=websecure
      - traefik.http.routers.brawltome-site.tls.certresolver=letsencrypt
      - traefik.http.routers.brawltome-site.service=brawltome-site
      - traefik.http.services.brawltome-site.loadbalancer.server.port=3000
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=32m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
          pids: 128
        reservations:
          memory: 128M

  operations-worker:
    image: ghcr.io/nicktacke/brawltome-operations-worker:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    environment:
      AUTHENTICATED_REFRESH_IP_LIMIT: "120"
      BRAWLHALLA_V1_REQUEST_LIMIT: "1800"
      # Discovery reconciliation is a safety net (the outbox delivers changes in seconds) and holds the projection lock
      # for its ~3 minute run, delaying search updates; every 6 hours instead of hourly.
      DISCOVERY_RECONCILIATION_INTERVAL_MS: "21600000"
      # One background refresh at a time, every 10 s: Brawlhalla rate-limits short V0 bursts (Retry-After 5 s) well
      # below the 180-per-15-minute budget, and four at once triggered 429s. The usage gate still sets the overall pace.
      FRESHNESS_BATCH: "1"
      FRESHNESS_INTERVAL_MS: "10000"
      HEALTH_PORT: "3001"
      LEADERBOARD_INTERVAL_MS: "900000"
      LEADERBOARD_PAGE_DEPTH: "20"
      NODE_ENV: production
      OPERATIONS_INTERACTIVE_CONCURRENCY: "2"
      OPERATIONS_INTERACTIVE_RESERVATION: "1"
      # Two leaderboard slots: the hourly deep crawl and the 15-minute top-page collections each need most of an hour
      # on one slot, so they run side by side. BRAWLHALLA_V1_REQUEST_LIMIT admission still caps V1 calls (peak ~900 of
      # 1800 per five minutes on one slot). The extra total slot keeps projection and statistics work from starving.
      OPERATIONS_LEADERBOARD_CONCURRENCY: "2"
      OPERATIONS_TOTAL_CONCURRENCY: "4"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Idle pool connections close after 60 s (see api), keeping deploy overlap under max_connections.
      PGIDLE_TIMEOUT: "60"
      RANKING_RETENTION_BATCH: "200"
      # Set RANKING_RETENTION_ENABLED=false in the deployment environment to pause retention without a code change.
      RANKING_RETENTION_ENABLED: ${RANKING_RETENTION_ENABLED:-true}
      RANKING_RETENTION_HOURS: "24"
      RUNTIME_CLEANUP_RESERVE_MS: "5000"
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      SOURCE_BACKGROUND_HEADROOM: "30"
      SOURCE_UNAVAILABLE_RETRY_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - brawlhalla_api_key
      - metrics_scrape_secret
      - runtime_database_url
      - otel_authorization
    networks:
      - application
      - observability
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3001/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
          pids: 256
        reservations:
          memory: 256M

  discord-bot:
    profiles: [discord]
    image: ghcr.io/nicktacke/brawltome-discord-bot:${BRAWLTOME_IMAGE_TAG:?Set the release commit}
    environment:
      API_URL: http://api:3000
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-deferred}
      DISCORD_METRICS_PORT: "3002"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUNTIME_SHUTDOWN_DEADLINE_MS: "60000"
      TELEMETRY_TRACE_SAMPLE_RATE: "0.1"
    secrets:
      - discord_internal_api_secret
      - discord_token
      - internal_api_secret
      - metrics_scrape_secret
      - otel_authorization
    networks:
      - application
      - observability
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r = await fetch('http://localhost:3002/health/ready'); if (!r.ok) process.exit(1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 70s
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750,size=64m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 192
        reservations:
          memory: 192M

networks:
  application:
    external: true
    name: brawltome
  observability:
    external: true
    name: brawltome-observability
  dokploy-network:
    external: true
    name: dokploy-network

secrets:
  brawlhalla_api_key:
    name: brawltome_brawlhalla_api_key
    file: /var/lib/brawltome-secrets/brawlhalla-api-key
  dead_letter_database_url:
    name: brawltome_dead_letter_database_url
    file: /var/lib/brawltome-secrets/dead-letter-database-url
  dead_letter_operator_tokens:
    name: brawltome_dead_letter_operator_tokens
    file: /var/lib/brawltome-secrets/dead-letter-operator-tokens
  discord_client_secret:
    name: brawltome_discord_client_secret
    file: /var/lib/brawltome-secrets/discord-client-secret
  discord_internal_api_secret:
    name: brawltome_discord_internal_api_secret
    file: /var/lib/brawltome-secrets/discord-internal-api-secret
  discord_token:
    name: brawltome_discord_token
    file: /var/lib/brawltome-secrets/discord-token
  internal_api_secret:
    name: brawltome_internal_api_secret
    file: /var/lib/brawltome-secrets/internal-api-secret
  matches_preview_token:
    name: brawltome_matches_preview_token
    file: /var/lib/brawltome-secrets/matches-preview-token
  metrics_scrape_secret:
    name: brawltome_metrics_scrape_secret
    file: /var/lib/brawltome-secrets/metrics-scrape-secret
  migration_database_url:
    name: brawltome_migration_database_url
    file: /var/lib/brawltome-secrets/migration-database-url
  otel_authorization:
    name: brawltome_otel_authorization
    file: /var/lib/brawltome-secrets/otel-authorization
  postgres_dead_letter_password:
    name: brawltome_postgres_dead_letter_password
    file: /var/lib/brawltome-secrets/postgres-dead-letter-password
  postgres_owner_password:
    name: brawltome_postgres_owner_password
    file: /var/lib/brawltome-secrets/postgres-owner-password
  postgres_runtime_password:
    name: brawltome_postgres_runtime_password
    file: /var/lib/brawltome-secrets/postgres-runtime-password
  refresh_trust_cookie_secret:
    name: brawltome_refresh_trust_cookie_secret
    file: /var/lib/brawltome-secrets/refresh-trust-cookie-secret
  replay_bridge_secret:
    name: brawltome_replay_bridge_secret
    file: /var/lib/brawltome-secrets/replay-bridge-secret
  runtime_database_url:
    name: brawltome_runtime_database_url
    file: /var/lib/brawltome-secrets/runtime-database-url
  turnstile_secret_key:
    name: brawltome_turnstile_secret_key
    file: /var/lib/brawltome-secrets/turnstile-secret-key
