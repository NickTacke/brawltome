groups:
  - name: brawltome-operational
    interval: 15s
    rules:
      - alert: RuntimeMetricsTargetDown
        expr: up{job=~"api|operations-worker|web|discord"} == 0
        for: 2m
        labels:
          severity: critical
          service: brawltome
          signal: metrics-reachability
        annotations:
          summary: "{{ $labels.runtime }} metrics target is unreachable"
          description: "The dedicated metrics scrape has failed for at least two minutes."

      - alert: RuntimeNotReady
        expr: probe_success{job="readiness"} == 0
        for: 2m
        labels:
          severity: critical
          service: brawltome
          signal: readiness
        annotations:
          summary: "{{ $labels.runtime }} is not ready"
          description: "The dependency-aware readiness probe has failed for at least two minutes."

      - alert: WorkerHeartbeatStale
        expr: time() - max by (runtime) (worker_heartbeat_timestamp_seconds) > 60
        for: 2m
        labels:
          severity: critical
          service: brawltome
          signal: worker-heartbeat
        annotations:
          summary: "{{ $labels.runtime }} heartbeat is stale"
          description: "No successful worker loop heartbeat has been observed for more than one minute."

      - alert: OldestRunnableJobDelayed
        expr: max by (work_class) (operation_oldest_pending_age_ms) > 900000
        for: 5m
        labels:
          severity: warning
          service: brawltome
          signal: oldest-job
        annotations:
          summary: "{{ $labels.work_class }} runnable work is delayed"
          description: "The oldest runnable operation has exceeded the initial 15-minute operator threshold."

      - alert: ScheduleMaterializationLate
        expr: max by (kind) (schedule_lateness_ms) > 300000
        for: 5m
        labels:
          severity: warning
          service: brawltome
          signal: schedule-lateness
        annotations:
          summary: "{{ $labels.kind }} schedule is late"
          description: "An enabled schedule has remained more than five minutes late."

      # Fires on newly dead-lettered work only. The gauge counts every unresolved dead letter, so alerting on its
      # level paged continuously; admission rejections (reason="admission_rejected") are expected user outcomes.
      # The gauge delta also covers dead letters that bypass the worker attempt counter (expired leases, restarts).
      - alert: NewDeadLetters
        expr: |
          sum by (work_class, kind) (increase(operation_attempts_total{outcome="dead_letter"}[30m])) > 0
          or max by (work_class, kind) (delta(operation_dead_letters{reason="execution"}[30m])) > 0
        for: 1m
        labels:
          severity: critical
          service: brawltome
          signal: dead-letters
        annotations:
          summary: "{{ $labels.kind }} produced new dead letters"
          description: "At least one {{ $labels.work_class }} operation was dead-lettered in the last 30 minutes. Inspect it with the operations:dead-letters CLI."

      - alert: SourceQuotaNearLimit
        expr: max by (domain) (source_quota_used) / clamp_min(max by (domain) (source_quota_limit), 1) >= 0.9
        for: 2m
        labels:
          severity: warning
          service: brawltome
          signal: source-quota
        annotations:
          summary: "{{ $labels.domain }} source quota is at least 90 percent used"
          description: "Distributed source admission is close to its fixed window limit."

      - alert: RefreshFailuresElevated
        # A deep crawl waits out a Brawlhalla outage and resumes the same page, so its source_unavailable attempts are
        # deferrals, not lost work. Outages still alert through the regular leaderboard collections and refreshes.
        expr: |
          (
            sum by (kind, failure_category) (increase(refresh_failures_total{failure_category!="admission_deferred"}[15m]))
            unless on (kind, failure_category)
            refresh_failures_total{kind="leaderboard-deep-crawl", failure_category="source_unavailable"}
          ) > 2
        for: 1m
        labels:
          severity: warning
          service: brawltome
          signal: refresh-failures
        annotations:
          summary: "{{ $labels.kind }} refresh failures detected"
          description: "More than two refresh attempts failed in the last 15 minutes."

      - alert: HttpLatencyHigh
        expr: histogram_quantile(0.95, sum by (runtime, le) (rate(http_server_duration_ms_bucket[5m]))) > 250
        for: 5m
        labels:
          severity: warning
          service: brawltome
          signal: http-latency
        annotations:
          summary: "{{ $labels.runtime }} HTTP p95 exceeds 250 ms"
          description: "The five-minute HTTP p95 has exceeded the launch threshold."

      - alert: HttpErrorRateHigh
        # Health probes are excluded: readiness answers 503 by design while a runtime starts or drains during deploys.
        expr: sum by (runtime) (rate(http_server_requests_total{status_class="5xx",route!~"health_.*"}[5m])) / clamp_min(sum by (runtime) (rate(http_server_requests_total{route!~"health_.*"}[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: critical
          service: brawltome
          signal: http-errors
        annotations:
          summary: "{{ $labels.runtime }} HTTP 5xx rate exceeds one percent"
          description: "The fixed launch error boundary is breached over the five-minute window."

      - alert: PostgresBackupIntegrityFailed
        expr: |
          brawltome_postgres_backup_integrity_ok == 0
          or absent(brawltome_postgres_backup_integrity_ok)
          or absent(brawltome_postgres_backup_integrity_last_run_timestamp_seconds)
          or absent(brawltome_postgres_backup_integrity_latest_verified_timestamp_seconds)
          or time() - brawltome_postgres_backup_integrity_last_run_timestamp_seconds > 28800
          or time() - brawltome_postgres_backup_integrity_latest_verified_timestamp_seconds > 28800
        for: 5m
        labels:
          severity: critical
          service: brawltome
          signal: backup-integrity
        annotations:
          # Discord notifications render the summary, so the verifier failure reason is included there.
          summary: 'PostgreSQL backup integrity verification failed (reason: {{ with query "max by (reason) (brawltome_postgres_backup_integrity_failure_reason == 1)" }}{{ (index . 0).Labels.reason }}{{ else }}not reported{{ end }})'
          description: "The recurring backup checksum is missing, mismatched, stale, or has not been verified within eight hours."

      - alert: TelemetryStorageNearQuota
        expr: 1 - (node_filesystem_avail_bytes{mountpoint=~"/storage/(prometheus|loki|tempo)"} / node_filesystem_size_bytes{mountpoint=~"/storage/(prometheus|loki|tempo)"}) >= 0.8
        for: 5m
        labels:
          severity: warning
          service: brawltome
          signal: telemetry-storage
        annotations:
          summary: "Telemetry storage is at least 80 percent used"
          description: "A dedicated quota-backed telemetry filesystem is nearing capacity."

      # node-exporter sees the loop-mounted PostgreSQL ext4 filesystem through its read-only /storage/postgres bind.
      - alert: PostgresDiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/storage/postgres"} / node_filesystem_size_bytes{mountpoint="/storage/postgres"} < 0.2
        for: 10m
        labels:
          severity: warning
          service: brawltome
          signal: postgres-disk
        annotations:
          summary: "PostgreSQL data filesystem has less than 20 percent free"
          description: "Only {{ $value | humanizePercentage }} of the PostgreSQL data filesystem is available. Grow the loop image or reclaim space before writes fail."

      - alert: PostgresDiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/storage/postgres"} / node_filesystem_size_bytes{mountpoint="/storage/postgres"} < 0.1
        for: 5m
        labels:
          severity: critical
          service: brawltome
          signal: postgres-disk
        annotations:
          summary: "PostgreSQL data filesystem has less than 10 percent free"
          description: "Only {{ $value | humanizePercentage }} of the PostgreSQL data filesystem is available. PostgreSQL stops when it cannot extend files or WAL."

      # PostgreSQL is excluded because PostgresDiskSpaceLow already pages for it.
      - alert: FilesystemSpaceCritical
        expr: node_filesystem_avail_bytes{fstype="ext4",mountpoint!="/storage/postgres"} / node_filesystem_size_bytes{fstype="ext4",mountpoint!="/storage/postgres"} < 0.1
        for: 10m
        labels:
          severity: critical
          service: brawltome
          signal: filesystem-space
        annotations:
          summary: "{{ $labels.mountpoint }} has less than 10 percent free"
          description: "Only {{ $value | humanizePercentage }} of the ext4 filesystem mounted at {{ $labels.mountpoint }} is available."
