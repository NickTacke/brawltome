name: brawltome-observability-alert-evidence

services:
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    user: "65534:65534"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - discord_webhook_url
    ports:
      - 127.0.0.1:19093:9093
    depends_on:
      discord-receiver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64

  discord-receiver:
    image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    user: "1000:1000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["bun", "run", "/app/discord-receiver.ts"]
    volumes:
      - ./discord-receiver.ts:/app/discord-receiver.ts:ro
    ports:
      - 127.0.0.1:18080:8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 1s
      timeout: 1s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 32

secrets:
  discord_webhook_url:
    file: ./fixtures/discord-webhook-url
